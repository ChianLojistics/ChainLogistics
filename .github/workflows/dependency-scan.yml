name: Dependency Scan

# Vulnerability and license scanning across every backend component
# (Rust workspaces, Node packages, Python SDK, container base images).
#
# Strategy:
# - On PR: only NEW vulnerabilities introduced by the diff block merge
#   (osv-pr-scan). All other scanners run in report-only mode so that
#   pre-existing findings do not block unrelated PRs.
# - On push to main / schedule / workflow_dispatch: full scan, results
#   published to the Security tab as SARIF.
# - Daily 06:00 UTC: re-scan against the latest advisories so newly-
#   published CVEs against pinned versions surface without code changes.

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/pyproject.toml"
      - "**/requirements*.txt"
      - "**/Dockerfile"
      - ".github/workflows/dependency-scan.yml"
      - "deny.toml"
  push:
    branches: [ main ]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: dep-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # PR mode: scan diff and fail only on NEW vulnerabilities.
  # ---------------------------------------------------------------------------
  osv-pr-scan:
    name: OSV PR scan (new vulns only)
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.3.3
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        --recursive
        ./

  # ---------------------------------------------------------------------------
  # Full scan (push / schedule / manual): report all findings, do NOT fail.
  # SARIF uploads to the Security tab provide visibility without blocking.
  # ---------------------------------------------------------------------------
  osv-full-scan:
    name: OSV full scan (report)
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.3
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        --recursive
        ./
      fail-on-vuln: false

  # ---------------------------------------------------------------------------
  # cargo-audit + cargo-deny per Rust workspace.
  # Report-only (continue-on-error) until existing advisories are remediated.
  # ---------------------------------------------------------------------------
  rust-audit:
    name: Rust audit (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - backend
          - smart-contract
          - sdk/rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo bin
        id: cache-cargo-bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-audit-deny-v1

      - name: Install cargo-audit
        if: steps.cache-cargo-bin.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-audit

      - name: Install cargo-deny
        if: steps.cache-cargo-bin.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny

      - name: Run cargo-audit
        working-directory: ./${{ matrix.workspace }}
        run: cargo audit

      - name: Run cargo-deny (advisories, licenses, bans, sources)
        working-directory: ./${{ matrix.workspace }}
        run: cargo deny --manifest-path Cargo.toml check --config ${{ github.workspace }}/deny.toml

  # ---------------------------------------------------------------------------
  # npm audit for Node packages with lockfiles.
  # Threshold: critical only (report-only for high/moderate while existing
  # advisories are triaged). Bump back to `high` once frontend deps are clean.
  # ---------------------------------------------------------------------------
  npm-audit:
    name: npm audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        package:
          - frontend
          - "."
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: ./${{ matrix.package }}
        run: npm ci

      - name: Run npm audit (informational, all severities)
        working-directory: ./${{ matrix.package }}
        run: npm audit --audit-level=low || true

      - name: Run npm audit (fail on critical)
        working-directory: ./${{ matrix.package }}
        run: npm audit --audit-level=critical

  # ---------------------------------------------------------------------------
  # pip-audit for the Python SDK.
  # Report-only; we don't pass --strict because pyproject.toml has no lockfile,
  # which trips the strict resolver.
  # ---------------------------------------------------------------------------
  python-audit:
    name: pip-audit (sdk/python)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install --upgrade pip pip-audit

      - name: Run pip-audit on sdk/python
        working-directory: ./sdk/python
        run: pip-audit --vulnerability-service osv .

  # ---------------------------------------------------------------------------
  # Container scan: scan the backend Docker image for OS-level CVEs and
  # config issues. Report-only.
  # ---------------------------------------------------------------------------
  docker-scan:
    name: Trivy container scan (backend)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy Dockerfile config scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: backend/Dockerfile
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

      - name: Trivy filesystem vulnerability scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
          format: sarif
          output: trivy-backend.sarif

      - name: Upload Trivy SARIF
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend
