name: Dependency Scan

# Runs vulnerability and license checks against every backend component
# (Rust workspaces, Node packages, Python SDK, container base images).
#
# - On every PR: fast, fail-on-critical-or-high checks block merge.
# - On push to main: same checks plus SARIF upload to the Security tab.
# - Daily at 06:00 UTC: full re-scan against the latest advisories so that
#   new CVEs against pinned versions raise an issue without code changes.
# - workflow_dispatch: manual re-runs after triaging false positives.

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/pyproject.toml"
      - "**/requirements*.txt"
      - "**/Dockerfile"
      - ".github/workflows/dependency-scan.yml"
      - "deny.toml"
  push:
    branches: [ main ]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: dep-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # OSV-Scanner: covers Cargo + npm + pip across the whole repo from lockfiles.
  # Uploads SARIF to the Security tab on push to main.
  # ---------------------------------------------------------------------------
  osv-scan:
    name: OSV (multi-ecosystem)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.3
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        --recursive
        ./

  # ---------------------------------------------------------------------------
  # cargo-audit + cargo-deny per Rust workspace.
  # cargo-audit checks RustSec advisories against Cargo.lock.
  # cargo-deny enforces license, source, and ban policies via deny.toml.
  # ---------------------------------------------------------------------------
  rust-audit:
    name: Rust audit (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - backend
          - smart-contract
          - sdk/rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo bin
        id: cache-cargo-bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-audit-deny-v1

      - name: Install cargo-audit
        if: steps.cache-cargo-bin.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-audit

      - name: Install cargo-deny
        if: steps.cache-cargo-bin.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny

      - name: Run cargo-audit
        working-directory: ./${{ matrix.workspace }}
        run: cargo audit --deny warnings

      - name: Run cargo-deny (advisories, licenses, bans, sources)
        working-directory: ./${{ matrix.workspace }}
        run: cargo deny --manifest-path Cargo.toml --config ${{ github.workspace }}/deny.toml check

  # ---------------------------------------------------------------------------
  # npm audit for Node packages with lockfiles.
  # Threshold: fail on high or critical (block merge); moderate is reported only.
  # ---------------------------------------------------------------------------
  npm-audit:
    name: npm audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - frontend
          - "."
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: ./${{ matrix.package }}
        run: npm ci

      - name: Run npm audit (informational, all severities)
        working-directory: ./${{ matrix.package }}
        run: npm audit --audit-level=low || true

      - name: Run npm audit (fail on high or critical)
        working-directory: ./${{ matrix.package }}
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # pip-audit for the Python SDK.
  # Reads pyproject.toml; runs in an isolated venv to avoid the runner's
  # site-packages contaminating the audit set.
  # ---------------------------------------------------------------------------
  python-audit:
    name: pip-audit (sdk/python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install --upgrade pip pip-audit

      - name: Run pip-audit on sdk/python
        working-directory: ./sdk/python
        # --strict: fail if pip-audit cannot resolve any dependency
        # --vulnerability-service osv: cross-check against the OSV DB
        run: pip-audit --strict --vulnerability-service osv .

  # ---------------------------------------------------------------------------
  # Container scan: scan the backend Docker image for OS-level CVEs.
  # Uses Trivy because it covers OS packages + language deps inside the image.
  # ---------------------------------------------------------------------------
  docker-scan:
    name: Trivy container scan (backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan on Dockerfile
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: backend/Dockerfile
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy vulnerability scan on Cargo.lock
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-backend.sarif

      - name: Upload Trivy SARIF
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

  # ---------------------------------------------------------------------------
  # Aggregate gate: a single required check the branch protection rule can
  # reference. Fails if any upstream scanner failed.
  # ---------------------------------------------------------------------------
  dependency-scan-gate:
    name: Dependency scan gate
    runs-on: ubuntu-latest
    needs:
      - osv-scan
      - rust-audit
      - npm-audit
      - python-audit
      - docker-scan
    if: always()
    steps:
      - name: Verify all scans succeeded
        run: |
          fail=0
          for r in \
            "${{ needs.osv-scan.result }}" \
            "${{ needs.rust-audit.result }}" \
            "${{ needs.npm-audit.result }}" \
            "${{ needs.python-audit.result }}" \
            "${{ needs.docker-scan.result }}"; do
            if [ "$r" != "success" ]; then
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "One or more dependency scans failed."
            exit 1
          fi
          echo "All dependency scans passed."
