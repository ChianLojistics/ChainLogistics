name: Security Scan

# Higher-cost / static-analysis checks that run on a slower cadence than
# dependency-scan.yml. Vulnerability scanning of dependencies has moved to
# .github/workflows/dependency-scan.yml — this file now focuses on:
#   - CodeQL static analysis (JS/TS)
#   - License compliance review (frontend + Rust)
#   - Secret scanning (gitleaks)

on:
  schedule:
    # Weekly on Mondays at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]
    paths:
      - "frontend/**"
      - "backend/**"
      - "smart-contract/**"
      - "sdk/**"
      - ".github/workflows/security.yml"
      - "deny.toml"

permissions:
  contents: read
  security-events: write

jobs:
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # CodeQL does not support Rust. For Rust SAST, see clippy in CI and
        # cargo-deny in dependency-scan.yml.
        language: [ "javascript-typescript" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  license-check-frontend:
    name: License Compliance (frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install license-checker
        run: npm install -g license-checker

      - name: Check frontend licenses
        working-directory: ./frontend
        run: |
          license-checker --json --out licenses.json
          # GPL-family licenses are incompatible with this project's MIT
          # baseline; flag for review rather than auto-fail to avoid blocking
          # legitimate transitive deps until policy is set per-license.
          if grep -qE '"licenses":\s*"(A|L)?GPL' licenses.json; then
            echo "::warning::GPL-family licensed dependencies found — review for compatibility"
            grep -E '"licenses":\s*"(A|L)?GPL' licenses.json
          else
            echo "No GPL-family licenses found."
          fi

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report-frontend
          path: frontend/licenses.json
          retention-days: 30

  license-check-rust:
    name: License Compliance (rust)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - backend
          - smart-contract
          - sdk/rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo bin
        id: cache-cargo-bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-deny-v1

      - name: Install cargo-deny
        if: steps.cache-cargo-bin.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny

      - name: Check Rust licenses
        working-directory: ./${{ matrix.workspace }}
        run: cargo deny --manifest-path Cargo.toml check --config ${{ github.workspace }}/deny.toml licenses

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    # The gitleaks/gitleaks-action requires GITLEAKS_LICENSE for organizations.
    # Use the upstream gitleaks CLI directly so this works on user repos and
    # forks without any license setup.
    # Known false positives (test fixtures, doc placeholders, CI cache keys)
    # are allowlisted in .gitleaks.toml; any new finding fails the job.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose
