# cargo-deny policy for all Rust workspaces in this repository.
#
# Applies to: backend/, smart-contract/, sdk/rust/.
# Run locally with:
#   cargo deny --manifest-path <workspace>/Cargo.toml --config deny.toml check
#
# See https://embarkstudios.github.io/cargo-deny/ for the schema reference.

[graph]
all-features = true

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories — RustSec advisory database
# ---------------------------------------------------------------------------
[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # Add advisories here only after triage. Format:
    # { id = "RUSTSEC-XXXX-XXXX", reason = "<why this is acceptable>", expires = "YYYY-MM-DD" },
]

# ---------------------------------------------------------------------------
# Licenses — allow-list approach.
# Project baseline is MIT; the list below covers permissive licenses commonly
# found in transitive Rust deps. GPL/AGPL/LGPL are deliberately not allowed.
# ---------------------------------------------------------------------------
[licenses]
confidence-threshold = 0.9
# Ignore license checks for this repo's own (unpublished) crates — they have
# no `license` field because they are not published to crates.io.
private = { ignore = true }
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "OpenSSL",
    "MPL-2.0",
]
exceptions = [
    # Per-crate license exceptions. Example:
    # { allow = ["OpenSSL"], crate = "ring" },
]

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# ---------------------------------------------------------------------------
# Bans — duplicate dependency control and crate ban-list.
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    # Crates known to be unmaintained or replaced; add as discovered.
    # { crate = "openssl-sys", reason = "Prefer rustls-based stack" },
]
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources — only allow crates from crates.io and explicitly trusted git remotes.
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/stellar/rs-soroban-sdk",
]
