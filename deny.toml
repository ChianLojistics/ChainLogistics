# cargo-deny policy for all Rust workspaces in this repository.
#
# Applies to: backend/, smart-contract/, sdk/rust/.
# Run locally with:
#   cargo deny --manifest-path <workspace>/Cargo.toml --config deny.toml check
#
# See https://embarkstudios.github.io/cargo-deny/ for the schema reference.

[graph]
all-features = true

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories — RustSec advisory database
# ---------------------------------------------------------------------------
[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Triaged advisories with an acceptance rationale.
#
# All entries below are tracked for upgrade in follow-up work; they sit on the
# critical path of larger framework upgrades (sqlx 0.7 → 0.8, reqwest 0.11 →
# 0.12, soroban-sdk majors) that require coordinated code changes.
#
# Re-review cadence: this list MUST be revisited every 90 days. Entries should
# be removed once the upstream upgrade has shipped and the advisory no longer
# applies. cargo-deny 0.19.x does not support an `expires` field — the next
# release (0.20+) does, at which point we should add expiry dates.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin attack — no fix available; comes from sqlx-mysql, mitigated by not exposing rsa-key timing to attackers (no MySQL TLS endpoints exposed externally)." },
    { id = "RUSTSEC-2024-0363", reason = "sqlx 0.7 binary protocol cast — fixed in 0.8.1; upgrade is a breaking change tracked separately. Mitigated by validating request body size at the axum layer." },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained — transitive via utoipa-gen 4.x; resolved by utoipa 5.x upgrade (breaking)." },
    { id = "RUSTSEC-2024-0388", reason = "derivative unmaintained — transitive via ark-ec from soroban-env-host; pinned by soroban-sdk version, no safe upgrade path until soroban-sdk releases without ark-ec." },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained — transitive via soroban-env-common and sqlx-core; no safe upgrade. Macro-only crate, no runtime risk." },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained — transitive via reqwest 0.11; resolved by reqwest 0.12 (breaking change)." },
    { id = "RUSTSEC-2026-0097", reason = "rand unsoundness with custom logger — narrow precondition not met by any code path in this repo (we use standard tracing, not a custom log::Log impl that calls rand::rng())." },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki name constraints (URI) — transitive via rustls 0.21 in reqwest 0.11; resolved by reqwest 0.12 / rustls 0.23 upgrade. Not exploitable here: the service does not validate certificates with URI name constraints." },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki wildcard name constraints — same upgrade chain as RUSTSEC-2026-0098. Same non-exploitability rationale." },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki CRL panic — same upgrade chain as RUSTSEC-2026-0098. Service does not parse CRLs from untrusted input." },
]

# ---------------------------------------------------------------------------
# Licenses — allow-list approach.
# Project baseline is MIT; the list below covers permissive licenses commonly
# found in transitive Rust deps. GPL/AGPL/LGPL are deliberately not allowed.
# ---------------------------------------------------------------------------
[licenses]
confidence-threshold = 0.9
# Ignore license checks for this repo's own (unpublished) crates — they have
# no `license` field because they are not published to crates.io.
private = { ignore = true }
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "OpenSSL",
    "MPL-2.0",
]
exceptions = [
    # Per-crate license exceptions. Example:
    # { allow = ["OpenSSL"], crate = "ring" },
]

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# ---------------------------------------------------------------------------
# Bans — duplicate dependency control and crate ban-list.
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    # Crates known to be unmaintained or replaced; add as discovered.
    # { crate = "openssl-sys", reason = "Prefer rustls-based stack" },
]
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources — only allow crates from crates.io and explicitly trusted git remotes.
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/stellar/rs-soroban-sdk",
]
