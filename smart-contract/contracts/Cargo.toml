[package]
name = "chainlogistics"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Host-side only: used to produce real Ed25519 signatures for state-channel tests.
ed25519-dalek = "3.0.0"
